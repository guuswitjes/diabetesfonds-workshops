<title>Quiz nieuwe collega</title>

<style>
/* Layout: één vraag per scherm, groot voor de beamer. Stijl naar diabetesfonds.nl: warm gebroken wit, blauw #006ebd, rood accent, kaarten met 12px hoeken, knoppen bijna recht, de blauw-zwart-rode lijn. Bewust één lichte look, zoals de site. */
:root {
  --bg: #f4f4ec;
  --surface: #ffffff;
  --panel: #ecf2f9;
  --ink: #000000;
  --muted: #4d4d4d;
  --line: #cccccc;
  --blue: #006ebd;
  --blue-dark: #00599a;
  --red: #ec1c24;
  --good: #288835;
  --good-bg: #ecf7ed;
  --bad-bg: #fdeced;
  --display: "Varela Round", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: clamp(17px, 1.6vw, 22px); line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 24px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.kicker { font-family: var(--display); color: var(--blue); font-size: 1.15em; margin: 0; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; margin: 0; }
.track { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.track span { display: block; height: 100%; background: linear-gradient(90deg, var(--blue) 0 68%, #000 68% 71%, var(--red) 71%); width: 0; transition: width .35s ease; }
.card { background: var(--surface); border-radius: 12px; padding: clamp(20px, 4vw, 44px); display: flex; flex-direction: column; gap: 22px; }
h1 { font-family: var(--display); font-weight: 400; color: var(--blue); font-size: clamp(1.5em, 3.2vw, 2.3em); line-height: 1.2; margin: 0; text-wrap: balance; }
.topic { text-transform: uppercase; letter-spacing: .08em; font-size: .7em; font-weight: 600; color: var(--red); margin: 0; }
.options { display: grid; gap: 12px; }
.opt { font: inherit; text-align: left; color: var(--ink); background: var(--panel); border: 2px solid transparent; border-radius: 12px; padding: 16px 20px; cursor: pointer; display: flex; gap: 14px; align-items: baseline; min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.opt .key { font-family: var(--display); color: var(--blue); flex: none; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--red); background: var(--bad-bg); }
.feedback { border-radius: 12px; padding: 16px 20px; background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
.feedback .verdict { font-weight: 700; margin: 0; }
.feedback .verdict.ok { color: var(--good); }
.feedback .verdict.no { color: var(--red); }
.feedback p { margin: 0; }
.source { color: var(--muted); font-size: .85em; }
.sources { margin: 0; padding-left: 1.2em; }
.quote { margin: 6px 0 0; padding: 4px 0 4px 14px; border-left: 3px solid var(--blue); font-style: italic; font-size: .9em; color: var(--ink); }
.actions { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 600; border: 0; border-radius: 4px; padding: 12px 26px; background: var(--blue); color: #ffffff; cursor: pointer; }
.btn:hover { background: var(--blue-dark); }
.btn.ghost { background: transparent; color: var(--blue); border: 2px solid var(--blue); }
.btn.ghost:hover { background: var(--panel); }
.score { font-family: var(--display); font-size: clamp(3em, 9vw, 6em); color: var(--blue); line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
footer { color: var(--muted); font-size: .75em; }
.brandbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.df-logo { height: clamp(40px, 5vw, 56px); width: auto; display: block; }
.made { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--muted); font-size: .7em; }
.aid-logo { height: 22px; width: auto; display: block; }
.qgrid { display: grid; grid-template-columns: minmax(0, 1fr) clamp(180px, 30%, 300px); gap: clamp(20px, 3vw, 40px); align-items: start; }
.qmain { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.visual { width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; background: var(--panel); display: grid; place-items: center; margin: 0; }
.visual img { width: 100%; height: 100%; object-fit: cover; display: block; }
.visual svg { width: 52%; height: 52%; stroke: var(--blue); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.visual svg .acc { stroke: var(--red); stroke-width: 1.8; }
.credit { font-size: .6em; color: var(--muted); margin: 6px 0 0; }
@media (max-width: 700px) { .qgrid { grid-template-columns: 1fr; } .vis-wrap { order: -1; max-width: 220px; } }
@media (prefers-reduced-motion: reduce) { .track span { transition: none; } }
</style>

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function show() {
  const item = Q[i];
  count.textContent = "Vraag " + (i + 1) + " van " + Q.length;
  bar.style.width = (i / Q.length * 100) + "%";
  card.replaceChildren();

function answer(k, opts) {
  const item = Q[i], ok = k === item.a;

function end() {
  count.textContent = "Klaar";
