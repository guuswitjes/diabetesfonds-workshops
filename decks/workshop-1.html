img src=\"86c75803-a805-4b0b-b85a-820ec57ff858\" alt=\"AI Dichtbij\" style=\"height:34px;display:block\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px\"><div style=\"width:76px;height:76px;border-radius:14px;background:var(--pink);display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"38\" height=\"38\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv><span style=\"font-size:48px;font-weight:600;color:var(--white)\">15 min<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"21 De test\" data-speaker-notes=\"1:05 · 10 min\n\nJij bent nu de nieuwe collega, bij de bot van je buur.\nOp de laptop van de maker: jij typt, de maker kijkt mee en zegt niets.\n\nStel minstens drie vragen.\nTwee van de flip-over, en één waarvan je denkt dat het antwoord er niet in staat.\n\nKies twee feitelijke antwoorden en zoek ze op in de documenten.\n&quot;Klopt&quot; telt alleen als je de plek kunt aanwijzen.\n\nZou je deze bot aan een nieuwe collega geven? Eén regel, met waarom.\n\n---\nIn duo's, naast elkaar. Er wordt niets gedeeld: de bot blijft op de laptop van de maker, de ander typt.\nVijf minuten per bot, dan wisselen. Testkaart op papier.\nWaarom de ander typt: bij je eigen bot weet je wat je bedoelde, en stel je vragen waarvan je al weet dat hij ze kan.\" style=\"background:var(--surface);font-family:var(--font-body);color:var(--ink);box-sizing:border-box;padding:100px 120px 56px;display:flex;flex-direction:column\">\n  <h2 style=\"font-family:var(--font-heading);font-weight:900;font-size:88px;line-height:1.15;color:var(--ink);margin:0\">Jij bent de nieuwe <span class=\"wave\">collega<\u002Fspan>.<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:36px;margin-top:64px;max-width:1560px\">\n    <p style=\"font-size:36px;line-height:1.55;color:var(--ink);margin:0;text-wrap:pretty\">In duo's: de ander typt, op jouw laptop. Vijf minuten per bot, dan wisselen.<\u002Fp>\n    <p style=\"font-size:36px;line-height:1.55;color:var(--ink);margin:0;text-wrap:pretty\">Stel minstens drie vragen: twee van de flip-over, en één waarvan je denkt dat het antwoord niet in de documenten staat.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:16px;align-items:flex-start\">\n      <span class=\"label-bar\" style=\"font-size:24px;padding:10px 22px\">Zoek het op.<\u002Fspan>\n      <p style=\"font-size:36px;line-height:1.55;color:var(--ink);margin:0;text-wrap:pretty\">Kies twee feitelijke antwoorden en zoek ze op in de documenten.<\u002Fp>\n      <p style=\"font-size:36px;line-height:1.55;color:var(--ink);margin:0;text-wrap:pretty\">\"Klopt\" telt alleen als je de plek kunt aanwijzen.<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"font-size:36px;line-height:1.55;color:var(--ink);margin:0;font-weight:600;text-wrap:pretty\">Zou je deze bot aan een nieuwe collega geven? Eén regel, met waarom.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;display:flex;align-items:baseline;gap:16px\"><\u002Fdiv>\n  <div style=\"position:absolute;right:120px;bottom:52px;display:flex;align-items:center;gap:12px;background:var(--pink);color:var(--white);border-radius:999px;padding:12px 26px 12px 20px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"><\u002Fpath><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"><\u002Fpath><\u002Fsvg><span style=\"font-family:var(--font-body);font-size:26px;font-weight:600;line-height:1\">4.1<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"22 Wat zagen jullie\" data-speaker-notes=\"1:15 · 5 min\n\nWat zagen jullie?\nWaar gokte de bot, of stond iets er niet in?\nKloppen de antwoorden ook echt met de bronnen?\n\nEn wat deed hij bij de vraag waarvan het antwoord niet in de documenten stond?\nZei hij netjes dat het er niet in staat, of verzon hij iets?\n\nDus:\nHoe beter je instructie en documenten, hoe beter het antwoord.\nControleren blijft jouw werk.\n\n---\nTwee of drie duo's, kort.\nDe tweede vraag is de belangrijkste: daar zie je of het ingrediënt &quot;verzin niets&quot; in hun instructie werkte.\nDe les staat niet op de slide. Die zeg jij, als afsluiter van de ronde.\" style=\"background:var(--surface);font-family:var(--font-body);color:var(--ink);box-sizing:border-box;padding:100px 120px 56px;display:flex;flex-direction:column\">\n  <h2 style=\"font-family:var(--font-heading);font-weight:900;font-size:88px;line-height:1.15;color:var(--ink);margin:0\">Wat zagen <span class=\"wave\">jullie<\u002Fspan>?<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px;margin-top:100px\">\n    <div style=\"background:var(--white);border-radius:16px;box-shadow:var(--shadow-card);padding:52px 56px 60px;display:flex;flex-direction:column;gap:36px\">\n      <div style=\"width:76px;height:76px;border-radius:14px;background:var(--pink);display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"38\" height=\"38\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <p style=\"font-family:var(--font-heading);font-weight:700;font-size:48px;line-height:1.3;color:var(--ink);margin:0;text-wrap:pretty\">Waar gokte de bot? Kloppen de antwoorden met de bronnen?<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--white);border-radius:16px;box-shadow:var(--shadow-card);padding:52px 56px 60px;display:flex;flex-direction:column;gap:36px\">\n      <div style=\"width:76px;height:76px;border-radius:14px;background:var(--pink);display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"38\" height=\"38\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <p style=\"font-family:var(--font-heading);font-weight:700;font-size:48px;line-height:1.3;color:var(--ink);margin:0;text-wrap:pretty\">Wat deed hij bij de vraag die niet in de documenten stond?<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;display:flex;align-items:baseline;gap:16px\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"23 Stap 5\" class=\"theme-navy\" data-speaker-notes=\"1:20 tot 1:30\n\nJullie hebben nu één ding gebouwd: een bot die vragen beantwoordt.\nMet dezelfde documenten kun je nog veel meer maken.\nWij hebben het vooraf geprobeerd. Kijk maar.\n\n---\nWij hebben dezelfde opdracht vooraf uitgewerkt. Alles staat klaar: live genereren kost tijd en kan net misgaan.\" style=\"background:var(--surface);font-family:var(--font-body);color:var(--ink);box-sizing:border-box;padding:100px 120px 72px;display:flex;flex-direction:column\">\n  <div><span class=\"label-bar\" style=\"font-size:24px;padding:12px 26px\">Stap 5<\u002Fspan><\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center\">\n    <h2 style=\"font-family:var(--font-heading);font-weight:900;font-size:128px;line-height:1.15;color:var(--ink);margin:0;max-width:1500px\">Zo kan het <span class=\"wave\">ook<\u002Fspan><\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center\">\n    <div style=\"display:flex;align-items:baseline;gap:16px\"><img src=\"86c75803-a805-4b0b-b85a-820ec57ff858\" alt=\"AI Dichtbij\" style=\"height:34px;display:block\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px\"><div style=\"width:76px;height:76px;border-radius:14px;background:var(--pink);display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"38\" height=\"38\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv><span style=\"font-size:48px;font-weight:600;color:var(--white)\">10 min<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"24 Quiz en video\" data-speaker-notes=\"1:20 · 10 min\n\nEerst een quiz voor de nieuwe collega, gemaakt op dezelfde documenten.\nWie weet het antwoord?\n\nEn dit is een welkomstfilmpje voor de nieuwe collega, gemaakt van de onboardingdocumenten.\n\nJe kunt pas bedenken wat je met AI wilt als je weet wat er kan.\nDit is dezelfde kennis als in jullie bot, in een andere vorm.\n\n---\nQuiz, 5 min: twee of drie vragen, de zaal antwoordt hardop.\nVideo, 5 min: het filmpje van Mathijs afspelen. De video van de eerste werkdag is vervallen (doorloop 9 oktober).\nKlik op een kader: de quiz of video opent in een nieuw tabblad. F11 voor volledig scherm, daarna terug naar het deck. Hapert het netwerk, dan blijft het screenshot staan.\nVOORAF (Guus, voor 13 oktober): link en screenshot van Mathijs' filmpje in kader 2, en één keer op beide kaders klikken vanuit de presentatiemodus van Claude Design.\nVraagt iemand hoe je zoiets maakt: vraag het aan Claude terwijl hij het maakt. Niet uitgebreid uitleggen, daar is geen tijd voor.\" style=\"background:var(--surface);font-family:var(--font-body);color:var(--ink);box-sizing:border-box;padding:100px 120px 56px;display:flex;flex-direction:column\">\n  <div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:64px\">\n    <div style=\"display:flex;flex-direction:column;gap:28px;min-height:0\">\n      <a href=\"https://claude.ai/artifact/ExmpT3iUG6orDE7vqDF1Mv\" target=\"_blank\" rel=\"noopener\" aria-label=\"Quiz voor de nieuwe collega openen in nieuw tabblad\" style=\"flex:1;min-height:0;position:relative;display:block;border-radius:16px;border:2px solid var(--light);background:#F4F3EE;box-shadow:var(--shadow-card);overflow:hidden;cursor:pointer\">\n        <img src=\"f5474ab7-66a1-43f6-9223-abc9d84217b2\" alt=\"Quiz voor de nieuwe collega\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block\">\n        <span style=\"position:absolute;right:20px;bottom:20px;width:56px;height:56px;border-radius:10px;background:var(--pink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card)\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 3h6v6\"><\u002Fpath><path d=\"M10 14 21 3\"><\u002Fpath><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fa>\n      <span style=\"font-size:32px;font-weight:600;color:var(--ink)\">Quiz voor de nieuwe collega<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:28px;min-height:0\">\n      <div aria-label=\"Een welkomstfilmpje voor de nieuwe collega\" style=\"flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;border-radius:16px;border:2px solid var(--light);background:#F4F3EE;box-shadow:var(--shadow-card);overflow:hidden\">\n        <span style=\"font-size:32px;line-height:1.4;color:var(--ink);border:2px dashed var(--pink);border-radius:2px;padding:0 .3em\">[link naar het filmpje van Mathijs]<\u002Fspan>\n        <span style=\"position:absolute;right:20px;bottom:20px;width:56px;height:56px;border-radius:10px;background:var(--pink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card)\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 3h6v6\"><\u002Fpath><path d=\"M10 14 21 3\"><\u002Fpath><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size:32px;font-weight:600;color:var(--ink)\">Een welkomstfilmpje voor de nieuwe collega<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:40px;display:flex;align-items:baseline;gap:16px\"><\u002Fdiv>\n  <div style=\"position:absolute;right:120px;bottom:52px;display:flex;align-items:center;gap:12px;background:var(--pink);color:var(--white);border-radius:999px;padding:12px 26px 12px 20px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"><\u002Fpath><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"><\u002Fpath><\u002Fsvg><span style=\"font-family:var(--font-body);font-size:26px;font-weight:600;line-height:1\">5.1<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"25 Stap 6\" class=\"theme-navy\" data-speaker-notes=\"1:30 tot 1:50\n\nTot nu toe ging alles over de onboarding van het Diabetes Fonds.\nEen voorbeeld dat we samen deden.\nNu jullie eigen werk.\nWat je vandaag zag, waar komt dat bij jou terug?\n\n---\nHet gesprek over het eigen werk, de signalen, wanneer niet, situaties op papier, afsluiten.\" style=\"background:var(--surface);font-family:var(--font-body);color:var(--ink);box-sizing:border-box;padding:100px 120px 72px;display:flex;flex-direction:column\">\n  <div><span class=\"label-bar\" style=\"font-size:24px;padding:12px 26px\">Stap 6<\u002Fspan><\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center\">\n    <h2 style=\"font-family:var(--font-heading);font-weight:900;font-size:128px;line-height:1.15;color:var(--ink);margin:0;max-width:1500px\">Terug naar het eigen <span class=\"wave\">werk<\u002Fspan><\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center\">\n    <div style=\"display:flex;align-items:baseline;gap:16px\"><img src=\"86c75803-a805-4b0b-b85a-820ec57ff858\" alt=\"AI Dichtbij\" style=\"height:34px;display:block\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px\"><div style=\"width:76px;height:76px;border-radius:14px;background:var(--pink);display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"38\" height=\"38\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv><span style=\"font-size:48px;font-weight:600;color:var(--white)\">20 min<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"26 Het gesprek\" data-speaker-notes=\"1:30 · 7 min\n\nWat betekent dit voor jouw werk?\nWaar zie je parallellen?\nWat roept het op?\n\n---\nIedereen krijgt de signalenlijst.\nLaat het gesprek lopen.\" style=\"background:var(--surface);font-family:var(--font-body);color:var(--ink);box-sizing:border-box;padding:100px 120px 56px;display:flex;flex-direction:column\">\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:56px\">\n    <h2 style=\"font-family:var(--font-heading);font-weight:900;font-size:120px;line-height:1.15;color:var(--ink);margin:0;max-width:1600px;text-wrap:pretty\">Wat betekent dit voor jouw <span class=\"wave\">werk<\u002Fspan>?<\u002Fh2>\n    <p style=\"font-size:36px;line-height:1.5;color:var(--grey);margin:0\">Waar zie je parallellen? Wat roept het op?<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:baseline;gap:16px\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"27 De signalen\" data-speaker-notes=\"Veel informatie verwerken.\nIets steeds opnieuw maken.\nDezelfde inhoud voor verschillende mensen.\nEen leeg vel.\n\n---\nAlleen pakken als het gesprek stilvalt.\" style=\"background:var(--surface);font-family:var(--font-body);color:var(--ink);box-sizing:border-box;padding:100px 120px 56px;display:flex;flex-direction:column\">\n  <h2 style=\"font-family:var(--font-heading);font-weight:900;font-size:88px;line-height:1.15;color:var(--ink);margin:0\">Waar zit het in jouw <span class=\"wave\">werk<\u002Fspan>?<\u002Fh2>\n  <div style=\"flex:1;display:flex;flex-wrap:wrap;align-content:center;gap:36px 32px;max-width:1640px\">\n    <span style=\"font-size:36px;line-height:1.3;color:var(--ink);border:2px solid var(--navy);border-radius:999px;padding:22px 40px\">veel informatie verwerken<\u002Fspan>\n    <span style=\"font-size:36px;line-height:1.3;color:var(--ink);border:2px solid var(--navy);border-radius:999px;padding:22px 40px;margin-left:40px\">analyseren of vergelijken<\u002Fspan>\n    <span style=\"font-size:36px;line-height:1.3;color:var(--ink);border:2px solid var(--navy);border-radius:999px;padding:22px 40px\">terugkerend werk<\u002Fspan>\n    <span style=\"font-size:36px;line-height:1.3;color:var(--ink);border:2px solid var(--navy);border-radius:999px;padding:22px 40px;margin-left:90px\">een leeg vel<\u002Fspan>\n    <span style=\"font-size:36px;line-height:1.3;color:var(--ink);border:2px solid var(--navy);border-radius:999px;padding:22px 40px;margin-left:20px\">dezelfde inhoud voor verschillende doelgroepen<\u002Fspan>\n    <span style=\"font-size:36px;line-height:1.3;color:var(--ink);border:2px solid var(--navy);border-radius:999px;padding:22px 40px;margin-left:60px\">iemand die kritisch meedenkt<\u002Fspan>\n    <span style=\"font-size:36px;line-height:1.3;color:var(--ink);border:2px solid var(--navy);border-radius:999px;padding:22px 40px;margin-left:130px\">informatie omzetten naar een andere vorm<\u002Fspan>\n    <span style=\"font-size:36px;line-height:1.3;color:var(--ink);border:2px solid var(--navy);border-radius:999px;padding:22px 40px\">tijdrovende voorbereiding<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:baseline;gap:16px\"><\u002Fdiv>\n  <div style=\"position:absolute;right:120px;bottom:52px;display:flex;align-items:center;gap:12px;background:var(--pink);color:var(--white);border-radius:999px;padding:12px 26px 12px 20px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"><\u002Fpath><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"><\u002Fpath><\u002Fsvg><span style=\"font-family:var(--font-body);font-size:26px;font-weight:600;line-height:1\">6.1<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"28 Dit kwam van jullie\" data-speaker-notes=\"1:37 · 2 min\n\nDit hebben jullie ingevuld bij de aanmelding.\nNiet letterlijk, wel in onze woorden.\nHerken je je eigen idee?\nWil iemand vertellen wat erachter zit?\n\nGeen eigen idee voor de bouwopdracht? Kies er hier een.\n\n---\nEén of twee mensen laten toelichten, niet iedereen.\nBij publieksvragen en artikelen geldt de spelregel: geen persoonsgegevens.\nEen beoordeling op bewijskracht checkt altijd een mens.\nSalesforce: werk met een export, niet in Salesforce zelf.\nVraagt iemand naar inschrijvingen voor een evenement: daar zitten persoonsgegevens in, dus niet mee bouwen.\" style=\"background:var(--surface);font-family:var(--font-body);color:var(--ink);box-sizing:border-box;padding:100px 120px 56px;display:flex;flex-direction:column\">\n  <h2 style=\"font-family:var(--font-heading);font-weight:900;font-size:88px;line-height:1.15;color:var(--ink);margin:0\">Dit kwam van <span class=\"wave\">jullie<\u002Fspan><\u002Fh2>\n  <p style=\"font-size:30px;line-height:1.5;color:var(--grey);margin:28px 0 0;max-width:1600px;text-wrap:pretty\">Uit het aanmeldformulier, in onze woorden. Geen eigen idee? Kies er een voor je bouwopdracht.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;margin-top:56px;align-items:start\">\n    <div style=\"background:var(--white);border-radius:16px;box-shadow:var(--shadow-card);padding:36px 36px 40px;display:flex;flex-direction:column;gap:20px\">\n      <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:36px;line-height:1.2;color:var(--ink);margin:0\">Schrijven en verslagen<\u002Fh3>\n      <ul style=\"margin:0;padding:0 0 0 1.1em;display:flex;flex-direction:column;gap:14px\">\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Notulen en verslagen van vergaderingen uitwerken<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Een memo schrijven op basis van eerdere stukken<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Antwoorden op publieksvragen beter formuleren<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Teksten aanscherpen op de schrijfregels van het fonds<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"background:var(--white);border-radius:16px;box-shadow:var(--shadow-card);padding:36px 36px 40px;display:flex;flex-direction:column;gap:20px\">\n      <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:36px;line-height:1.2;color:var(--ink);margin:0\">Zoeken en bijhouden<\u002Fh3>\n      <ul style=\"margin:0;padding:0 0 0 1.1em;display:flex;flex-direction:column;gap:14px\">\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Nieuwe ontwikkelingen in onderzoek bijhouden<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Bronnen zoeken om een antwoord te onderbouwen<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Informatie over mogelijke samenwerkingspartners verzamelen<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Een wetenschappelijk artikel laten beoordelen op bewijskracht<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Een overleg of stuurgroep voorbereiden met alle stukken in één bot<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"background:var(--white);border-radius:16px;box-shadow:var(--shadow-card);padding:36px 36px 40px;display:flex;flex-direction:column;gap:20px\">\n      <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:36px;line-height:1.2;color:var(--ink);margin:0\">Data en rapportages<\u002Fh3>\n      <ul style=\"margin:0;padding:0 0 0 1.1em;display:flex;flex-direction:column;gap:14px\">\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Rapportages naast elkaar leggen en koppelen<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Een impactrapportage maken uit bestaande data<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Een export uit Salesforce of Excel analyseren<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Een stand van zaken maken over een onderwerp<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"background:var(--white);border-radius:16px;box-shadow:var(--shadow-card);padding:36px 36px 40px;display:flex;flex-direction:column;gap:20px\">\n      <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:36px;line-height:1.2;color:var(--ink);margin:0\">Beeld en content<\u002Fh3>\n      <ul style=\"margin:0;padding:0 0 0 1.1em;display:flex;flex-direction:column;gap:14px\">\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Een infographic bedenken en maken<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Content nalopen op fouten en beeldtaal<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Webpagina's controleren op vaste punten<\u002Fli>\n        <li style=\"font-size:24px;line-height:1.4;color:var(--ink)\">Een briefing strak trekken<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;right:120px;bottom:52px;display:flex;align-items:center;gap:12px;background:var(--pink);color:var(--white);border-radius:999px;padding:12px 26px 12px 20px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"><\u002Fpath><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"><\u002Fpath><\u002Fsvg><span style=\"font-family:var(--font-body);font-size:26px;font-weight:600;line-height:1\">6.2<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"29 Wanneer niet\" data-speaker-notes=\"1:39 · 1 min, daarna 3 min alleen\n\nEn andersom: waar is AI in je werk niet de moeite waard?\n\nJullie eigen kader zegt: AI alleen waar het duidelijke meerwaarde biedt.\nEen onboardingbot die elke nieuwe collega kan gebruiken: ja.\nTien varianten van een mail die je zelf in twee minuten schrijft: waarschijnlijk niet.\nEn wat echt van jou moet klinken, met emotie of jouw eigen toon: schrijf het eerst zelf.\n\nSchrijf nu twee of drie situaties uit je eigen werk op.\nWaar het wel de moeite waard is.\n\n---\nWacht op een eigen voorbeeld uit de groep, niet alleen het mail-voorbeeld. Dat is het succescriterium in de onderlegger.\n1:40, drie minuten alleen: twee of drie situaties op papier. Nog geen use case uitwerken.\nKomt terug in workshop 2, bij de criteria en de rode dots.\nKrap in de tijd? Sla deze slide over: de vragen komen op de volgende slide, en daar moet tijd voor zijn.\nDe discussie over energie en water voeren we hier niet.\" style=\"background:var(--surface);font-family:var(--font-body);color:var(--ink);box-sizing:border-box;padding:100px 120px 56px;display:flex;flex-direction:column\">\n  <h2 style=\"font-family:var(--font-heading);font-weight:900;font-size:80px;line-height:1.15;color:var(--ink);margin:0;max-width:1600px;text-wrap:pretty\">Waar is AI in je werk <span class=\"wave\">niet<\u002Fspan> de moeite waard?<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 2px 1fr;gap:96px;margin-top:96px\">\n    <div style=\"display:flex;flex-direction:column;gap:36px\">\n      <div style=\"width:76px;height:76px;border-radius:14px;background:var(--pink);display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"38\" height=\"38\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <p style=\"font-family:var(--font-heading);font-weight:700;font-size:46px;line-height:1.3;color:var(--ink);margin:0;text-wrap:pretty\">Een onboardingbot die elke nieuwe collega kan gebruiken: ja.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--navy);opacity:.15\"><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:36px\">\n      <div style=\"width:76px;height:76px;border-radius:14px;background:var(--navy);display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"38\" height=\"38\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <p style=\"font-family:var(--font-heading);font-weight:700;font-size:46px;line-height:1.3;color:var(--ink);margin:0;text-wrap:pretty\">Tien varianten van een mail die je zelf in twee minuten schrijft: waarschijnlijk niet.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:32px;line-height:1.5;color:var(--grey);margin:auto 0 0\">Jullie kader: AI alleen waar het duidelijke meerwaarde biedt.<\u002Fp>\n  <div style=\"margin-top:40px;display:flex;align-items:baseline;gap:16px\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"30 Twee dingen voor workshop 2\" class=\"theme-navy\" data-speaker-notes=\"1:43 · 7 min\n\nEerst de check op de belofte. Drie vingers:\nheb je een eigen bot gebouwd en laten testen?\nheb je gezien wat het verschil maakt?\nheb je twee of drie situaties op papier?\n\nTwee dingen voor workshop 2.\n\nBouw één ding voor je eigen werk.\nKies een van je situaties en doe wat je vandaag voor de onboarding deed.\nEen project in Claude of een agent in Copilot, met goede instructies.\nSchrijf op waar je vastliep. Een half uur is genoeg.\n\nGeen eigen situatie waar je mee aan de slag wilt?\nKies een idee van de slide met jullie ideeën.\nOf ga verder met je onboardingbot van vandaag: maak hem beter, of maak er een quiz of een visual van.\n\nEn stel jezelf per situatie een paar vragen. Ze staan online onder 7.2:\nwat doe je nu, hoe vaak, hoeveel tijd kost het, kun je de informatie zelf meegeven, en welk risico hoort erbij.\nHet is geen formulier. Schrijf op wat je wilt en neem het mee naar workshop 2, daar werk je ermee verder.\n\nWorkshop 2 opent met wat jullie gebouwd hebben en waar je vastliep.\nNiet aan toegekomen? Kom gewoon, en vertel wat je tegenhield. Dat is net zo bruikbaar.\n\nZelfde spelregel: geen persoonsgegevens, donateurs- of gezondheidsgegevens, niets vertrouwelijks.\nIn de online omgeving staan bij 7.1 de linkjes naar wat je nodig hebt: de vijf ingrediënten, het filmpje over een agent in Copilot, en hoe je een goede instructie schrijft.\n\nVoor welke situatie bouw je iets, en wanneer?\n\n---\nNoem de datum van workshop 2 voor deze groep: groep A do 5 november, groep B di 10 november, groep C wo 11 november.\nSpreekuren, digitaal, 13:30 tot 14:30: do 22 oktober (groep A en B) en wo 4 november (iedereen). Inschrijven hoeft niet.\nNeem tijd voor deze slide, ook als het krap wordt: hier komen de vragen.\" style=\"background:var(--surface);font-family:var(--font-body);color:var(--ink);box-sizing:border-box;padding:100px 120px 56px;display:flex;flex-direction:column\">\n  <h2 style=\"font-family:var(--font-heading);font-weight:900;font-size:88px;line-height:1.15;color:var(--ink);margin:0\">Twee dingen voor <span class=\"wave\" style=\"white-space:nowrap\">workshop 2<\u002Fspan><\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:80px;margin-top:64px\">\n    <div style=\"display:grid;grid-template-columns:72px 1fr;align-items:baseline\"><span style=\"font-family:var(--font-heading);font-weight:900;font-size:56px;color:var(--pink)\">1.<\u002Fspan><p style=\"font-size:34px;line-height:1.55;color:var(--white);margin:0;text-wrap:pretty\">Bouw één ding voor je eigen werk. Een project in Claude of een agent in Copilot, met goede instructies. Schrijf op waar je vastliep.<\u002Fp><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:72px 1fr;align-items:baseline\"><span style=\"font-family:var(--font-heading);font-weight:900;font-size:56px;color:var(--pink)\">2.<\u002Fspan><p style=\"font-size:34px;line-height:1.55;color:var(--white);margin:0;text-wrap:pretty\">Beantwoord de vragen voor jezelf, en neem ze mee naar workshop 2.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:56px;display:flex;flex-direction:column;gap:10px\">\n    <p style=\"font-size:26px;line-height:1.5;color:var(--ink-body);margin:0\">Niet aan bouwen toegekomen? Kom gewoon, en vertel wat je tegenhield.<\u002Fp>\n    <p style=\"font-size:26px;line-height:1.5;color:var(--ink-body);margin:0\">Spreekuur, digitaal, 13:30 tot 14:30: donderdag 22 oktober (groep A en B) of woensdag 4 november.<\u002Fp>\n  <\u002Fdiv>\n  <p style=\"font-family:var(--font-heading);font-weight:700;font-size:52px;line-height:1.3;color:var(--white);margin:auto 0 0;padding-top:40px;border-top:2px solid rgba(255,255,255,.15)\">Voor welke situatie bouw je iets, en wanneer?<\u002Fp>\n  <div style=\"margin-top:36px;display:flex;align-it
